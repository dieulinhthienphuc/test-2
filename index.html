<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FlashCards</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0f0e17;--surface:#1a1929;--surface2:#252438;
  --card-a:#1e1d30;--card-b:#16213e;
  --text:#fffffe;--muted:#9a9bb8;--muted2:#6b6d8a;
  --accent:#ff6b6b;--accent2:#ffd166;--accent3:#06d6a0;--accent4:#a78bfa;
  --border:rgba(255,255,255,0.08);--shadow:rgba(0,0,0,0.5);
  --correct:#06d6a0;--wrong:#ff6b6b;--skip:#ffd166;
  --nav-h:60px;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
}
.light{
  --bg:#f4f4f8;--surface:#ffffff;--surface2:#eaeaf0;
  --card-a:#ffffff;--card-b:#eef0fb;
  --text:#1a1929;--muted:#5a5c78;--muted2:#9a9bb8;
  --border:rgba(0,0,0,0.09);--shadow:rgba(0,0,0,0.1);
}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);display:flex;flex-direction:column}

/* TOPBAR */
.topbar{
  height:52px;flex-shrink:0;
  background:var(--bg);border-bottom:1px solid var(--border);
  padding:0 14px;display:flex;align-items:center;gap:10px;
  position:relative;z-index:10;
}
.topbar h1{font-size:1rem;font-weight:700;flex:1;letter-spacing:-.3px}
.topbar h1 span{color:var(--accent)}
.icon-btn{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:1rem;
  flex-shrink:0;transition:all .2s;
}
.icon-btn:active{transform:scale(.93)}

/* SCROLL AREA */
.scroll-area{
  flex:1;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding-bottom:calc(var(--nav-h) + 16px);
}
.page-content{max-width:520px;margin:0 auto;padding:14px 14px 0}

/* TABS */
.tab-scroll{overflow-x:auto;margin-bottom:12px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.tab-scroll::-webkit-scrollbar{height:0}
.tabs{display:flex;gap:6px;width:max-content}
.tab{
  padding:6px 14px;border-radius:99px;border:1px solid var(--border);
  background:var(--surface);color:var(--muted);cursor:pointer;
  font-size:.75rem;font-family:inherit;white-space:nowrap;
  transition:all .2s;min-height:34px;display:flex;align-items:center;
}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.tab.has-prog{border-color:var(--accent3);color:var(--accent3)}
.tab.has-prog.active{background:var(--accent3);border-color:var(--accent3);color:#0f0e17}

/* MODE ROW */
.mode-row{display:flex;gap:8px;margin-bottom:12px}
.mode-btn{
  flex:1;padding:9px 4px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface);color:var(--muted);cursor:pointer;
  font-size:.78rem;font-family:inherit;font-weight:500;text-align:center;
  transition:all .15s;min-height:40px;
}
.mode-btn.active{background:var(--accent4);border-color:var(--accent4);color:#fff}

/* PROGRESS BAR */
.prog-wrap{margin-bottom:12px}
.prog-info{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);margin-bottom:5px}
.prog-bar{height:5px;background:var(--surface2);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px;transition:width .4s}

/* STATS MINI */
.stats-mini{display:flex;gap:8px;margin-bottom:12px}
.stat-chip{flex:1;padding:8px;border-radius:12px;background:var(--surface);border:1px solid var(--border);text-align:center}
.stat-chip .num{font-size:1.25rem;font-weight:700}
.stat-chip .lbl{font-size:.65rem;color:var(--muted);margin-top:1px}
.green{color:var(--correct)}.red{color:var(--wrong)}.yellow{color:var(--skip)}.purple{color:var(--accent4)}

/* FLASH CARD */
.card-scene{
  width:100%;height:210px;
  cursor:pointer;margin-bottom:12px;
  position:relative;
}
/* Use opacity-swap instead of 3D flip for better Safari/mobile support */
.card-face{
  position:absolute;inset:0;border-radius:20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px 20px;border:1px solid var(--border);
  transition:opacity .25s,transform .25s;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
}
.card-front{background:var(--card-a);box-shadow:0 8px 32px var(--shadow)}
.card-back{
  background:var(--card-b);box-shadow:0 8px 32px var(--shadow);
  opacity:0;transform:scale(.98);
  pointer-events:none;
}
.card-scene.flipped .card-front{opacity:0;transform:scale(.98);pointer-events:none}
.card-scene.flipped .card-back{opacity:1;transform:scale(1);pointer-events:auto}
.card-lbl{font-size:.65rem;letter-spacing:2px;text-transform:uppercase;color:var(--muted2);margin-bottom:8px}
.card-word{font-size:clamp(1.6rem,5.5vw,2.4rem);font-weight:700;text-align:center;line-height:1.15}
.card-front .card-word{color:var(--text)}
.card-back .card-word{color:var(--accent2)}
.card-ph{margin-top:7px;font-size:.84rem;color:var(--accent3);font-weight:400}
.card-meaning{margin-top:6px;font-size:.84rem;color:var(--muted);text-align:center}
.card-ex{margin-top:5px;font-size:.73rem;color:var(--muted2);text-align:center;font-style:italic}
.card-hint{font-size:.7rem;color:var(--muted2);text-align:center;margin-bottom:8px}

/* CONTROLS */
.ctrl-row{display:flex;gap:10px;margin-bottom:12px}
.btn{
  padding:13px 20px;border-radius:99px;border:none;font-family:inherit;
  font-size:.9rem;font-weight:600;cursor:pointer;transition:all .15s;
  min-height:48px;
}
.btn:active{transform:scale(.97)}
.btn-know{background:var(--correct);color:#0f0e17;flex:1}
.btn-wrong{background:var(--wrong);color:#fff;flex:1}
.btn-flip{background:var(--surface2);color:var(--text);flex:1;border:1px solid var(--border)}

/* QUIZ */
.quiz-word{
  text-align:center;padding:24px 20px 18px;border-radius:20px;
  background:var(--card-a);border:1px solid var(--border);
  box-shadow:0 8px 32px var(--shadow);margin-bottom:12px;
}
.quiz-word .qw{font-size:clamp(1.7rem,5.5vw,2.5rem);font-weight:700;color:var(--text)}
.quiz-word .qph{font-size:.84rem;color:var(--accent3);margin-top:5px}
.quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.quiz-opt{
  padding:14px 10px;border-radius:14px;border:1.5px solid var(--border);
  background:var(--surface);color:var(--text);cursor:pointer;
  font-family:inherit;font-size:.84rem;font-weight:500;text-align:center;
  transition:all .15s;line-height:1.35;min-height:52px;
}
.quiz-opt:active:not(:disabled){transform:scale(.97)}
.quiz-opt.correct{background:rgba(6,214,160,.15);border-color:var(--correct);color:var(--correct)}
.quiz-opt.wrong{background:rgba(255,107,107,.15);border-color:var(--wrong);color:var(--wrong)}
.quiz-opt:disabled{cursor:default;opacity:.85}

/* TYPE */
.type-word{
  text-align:center;padding:24px 20px 18px;border-radius:20px;
  background:var(--card-a);border:1px solid var(--border);
  box-shadow:0 8px 32px var(--shadow);margin-bottom:12px;
}
.type-word .tw{font-size:clamp(1.7rem,5.5vw,2.5rem);font-weight:700}
.type-word .tph{font-size:.84rem;color:var(--accent3);margin-top:5px}
.type-word .tex{font-size:.73rem;color:var(--muted2);margin-top:5px;font-style:italic}
.type-input-wrap{display:flex;gap:8px;margin-bottom:8px}
.type-input{
  flex:1;padding:13px 16px;border-radius:12px;border:1.5px solid var(--border);
  background:var(--surface);color:var(--text);font-family:inherit;
  font-size:16px; /* must be ≥16px to prevent iOS zoom */
  outline:none;transition:border-color .2s;
}
.type-input:focus{border-color:var(--accent4)}
.type-input.correct-input{border-color:var(--correct);background:rgba(6,214,160,.08)}
.type-input.wrong-input{border-color:var(--wrong);background:rgba(255,107,107,.08)}
.btn-check{
  padding:13px 18px;border-radius:12px;border:none;
  background:var(--accent4);color:#fff;font-family:inherit;
  font-size:.9rem;font-weight:600;cursor:pointer;min-height:48px;
}
.btn-check:active{opacity:.85;transform:scale(.97)}
.type-feedback{
  text-align:center;padding:10px;border-radius:10px;
  font-size:.88rem;font-weight:600;margin-bottom:10px;display:none;
}
.type-feedback.show{display:block}
.type-feedback.ok{background:rgba(6,214,160,.12);color:var(--correct)}
.type-feedback.no{background:rgba(255,107,107,.12);color:var(--wrong)}

/* RESULT */
.result{
  display:none;flex-direction:column;align-items:center;
  text-align:center;gap:14px;padding:24px 0;
}
.result.show{display:flex}
.result-emoji{font-size:3rem}
.result-title{
  font-size:1.8rem;font-weight:800;
  background:linear-gradient(135deg,var(--accent2),var(--accent3));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.result-badges{display:flex;gap:20px}
.r-badge{display:flex;flex-direction:column;align-items:center;gap:3px}
.r-badge .n{font-size:1.9rem;font-weight:800}
.r-badge .l{font-size:.68rem;color:var(--muted)}
.result-msg{color:var(--muted);font-size:.85rem;max-width:260px}
.btn-restart{
  padding:13px 32px;border-radius:99px;border:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#0f0e17;font-family:inherit;font-size:.92rem;font-weight:700;cursor:pointer;
  min-height:48px;
}
.btn-restart:active{transform:scale(.97)}

/* WEAK */
.weak-list{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.weak-item{
  display:flex;align-items:center;gap:10px;padding:11px 14px;
  border-radius:12px;background:var(--surface);border:1px solid var(--border);
}
.weak-en{font-weight:700;font-size:.92rem;flex:1;min-width:0}
.weak-vi{font-size:.8rem;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.weak-score{
  font-size:.7rem;padding:3px 8px;border-radius:99px;
  background:rgba(255,107,107,.15);color:var(--wrong);font-weight:600;
  white-space:nowrap;flex-shrink:0;
}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted);font-size:.88rem}
.empty-state .big{font-size:2.5rem;display:block;margin-bottom:8px}

/* PROGRESS PAGE */
.prog-page-header{font-size:.78rem;color:var(--muted);margin-bottom:12px}
.cat-prog-list{display:flex;flex-direction:column;gap:8px}
.cat-prog-item{
  padding:10px 14px;border-radius:12px;
  background:var(--surface);border:1px solid var(--border);
}
.cat-prog-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.cat-prog-name{font-size:.82rem;font-weight:600}
.cat-prog-pct{font-size:.75rem;color:var(--accent3);font-weight:700}
.cat-prog-bar{height:4px;background:var(--surface2);border-radius:99px;overflow:hidden}
.cat-prog-fill{height:100%;background:linear-gradient(90deg,var(--accent3),var(--accent2));border-radius:99px}

/* SECTION TITLES */
.section-title{font-size:.95rem;font-weight:700;margin-bottom:4px}
.section-sub{font-size:.75rem;color:var(--muted);margin-bottom:12px}

/* BOTTOM NAV */
.bottom-nav{
  height:var(--nav-h);flex-shrink:0;
  background:var(--bg);border-top:1px solid var(--border);
  display:flex;justify-content:space-around;align-items:center;
  padding-bottom:env(safe-area-inset-bottom);
  position:relative;z-index:10;
}
.nav-btn{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:4px 20px;border-radius:10px;border:none;background:none;
  color:var(--muted);cursor:pointer;font-family:inherit;
  font-size:.6rem;font-weight:500;min-width:60px;
}
.nav-btn .ico{font-size:1.35rem;line-height:1}
.nav-btn.active{color:var(--accent)}
</style>
</head>
<body>

<div class="topbar">
  <h1>✦ <span>Flash</span>Cards</h1>
  <button class="icon-btn" id="btn-theme" onclick="toggleTheme()">🌙</button>
</div>

<div class="scroll-area" id="scroll-area">

  <!-- LEARN PAGE -->
  <div id="page-learn" class="page-content">
    <div class="tab-scroll"><div class="tabs" id="tabs"></div></div>
    <div class="mode-row">
      <button class="mode-btn active" id="m-flash" onclick="setMode('flash')">🃏 Thẻ</button>
      <button class="mode-btn" id="m-quiz" onclick="setMode('quiz')">🎯 Quiz</button>
      <button class="mode-btn" id="m-type" onclick="setMode('type')">⌨️ Gõ</button>
    </div>
    <div class="prog-wrap">
      <div class="prog-info">
        <span id="prog-text">Thẻ 1/20</span>
        <span id="prog-score">✅ 0 &nbsp;❌ 0</span>
      </div>
      <div class="prog-bar"><div class="prog-fill" id="prog-fill" style="width:0%"></div></div>
    </div>

    <!-- FLASH -->
    <div id="flash-ui">
      <div class="card-scene" id="card-scene" onclick="flipCard()">
        <div class="card-face card-front">
          <div class="card-lbl">Tiếng Anh</div>
          <div class="card-word" id="f-en">—</div>
          <div class="card-ph" id="f-ph"></div>
        </div>
        <div class="card-face card-back">
          <div class="card-lbl">Nghĩa</div>
          <div class="card-word" id="f-vi">—</div>
          <div class="card-meaning" id="f-type"></div>
          <div class="card-ex" id="f-ex"></div>
        </div>
      </div>
      <p class="card-hint">👆 Nhấn thẻ để lật · Vuốt trái/phải để trả lời</p>
      <div class="ctrl-row">
        <button class="btn btn-wrong" onclick="answer(false)">❌ Chưa nhớ</button>
        <button class="btn btn-know" onclick="answer(true)">✅ Đã nhớ</button>
      </div>
    </div>

    <!-- QUIZ -->
    <div id="quiz-ui" style="display:none">
      <div class="quiz-word">
        <div class="qw" id="q-en">—</div>
        <div class="qph" id="q-ph"></div>
      </div>
      <div class="quiz-opts" id="q-opts"></div>
    </div>

    <!-- TYPE -->
    <div id="type-ui" style="display:none">
      <div class="type-word">
        <div class="tw" id="t-en">—</div>
        <div class="tph" id="t-ph"></div>
        <div class="tex" id="t-ex"></div>
      </div>
      <div class="type-input-wrap">
        <input class="type-input" id="t-input" placeholder="Nhập nghĩa tiếng Việt..."
          autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
          onkeydown="if(event.key==='Enter')checkType()">
        <button class="btn-check" onclick="checkType()">→</button>
      </div>
      <div class="type-feedback" id="t-feedback"></div>
      <div class="ctrl-row" id="t-next-row" style="display:none">
        <button class="btn btn-flip" onclick="nextCard()" style="flex:1">Tiếp theo →</button>
      </div>
    </div>

    <!-- RESULT -->
    <div class="result" id="result">
      <div class="result-emoji">🎉</div>
      <div class="result-title">Hoàn thành!</div>
      <div class="result-badges">
        <div class="r-badge"><div class="n green" id="r-know">0</div><div class="l">Đã nhớ</div></div>
        <div class="r-badge"><div class="n red" id="r-wrong">0</div><div class="l">Cần ôn</div></div>
        <div class="r-badge"><div class="n purple" id="r-total">0</div><div class="l">Tổng</div></div>
      </div>
      <div class="result-msg" id="r-msg"></div>
      <button class="btn-restart" onclick="restart()">🔄 Học lại</button>
    </div>
  </div>

  <!-- WEAK PAGE -->
  <div id="page-weak" class="page-content" style="display:none">
    <div class="section-title">😰 Từ cần ôn</div>
    <div class="section-sub">Các từ bạn hay sai (sai ≥ 1 lần, tỷ lệ sai > 30%)</div>
    <div class="weak-list" id="weak-list"></div>
  </div>

  <!-- PROGRESS PAGE -->
  <div id="page-progress" class="page-content" style="display:none">
    <div class="section-title">📊 Tiến độ học</div>
    <div class="prog-page-header" id="prog-summary"></div>
    <div class="cat-prog-list" id="cat-prog-list"></div>
  </div>

</div><!-- end scroll-area -->

<div class="bottom-nav">
  <button class="nav-btn active" id="nav-learn" onclick="showPage('learn')">
    <span class="ico">🃏</span>Học
  </button>
  <button class="nav-btn" id="nav-weak" onclick="showPage('weak')">
    <span class="ico">😰</span>Từ yếu
  </button>
  <button class="nav-btn" id="nav-progress" onclick="showPage('progress')">
    <span class="ico">📊</span>Tiến độ
  </button>
</div>

const ALL_WORDS = Object.assign({}, _W1, _W2, _W3);

// ── STORAGE ──
const SK='fc2_prog';
function load(){try{return JSON.parse(localStorage.getItem(SK))||{};}catch{return {};}}
function save(s){try{localStorage.setItem(SK,JSON.stringify(s));}catch{}}
let store=load();
function recordAnswer(word,correct){
  if(!store[word])store[word]={seen:0,wrong:0};
  store[word].seen++;
  if(!correct)store[word].wrong++;
  store[word].last=Date.now();
  save(store);
}
function getWeak(word){const d=store[word];if(!d||d.seen<1)return 0;return d.wrong/d.seen;}

// ── STATE ──
let cats=Object.keys(ALL_WORDS), curCat=cats[0];
let deck=[],idx=0,knowC=0,wrongC=0,flipped=false,mode='flash';
let typeAnswered=false;

// ── TABS ──
function buildTabs(){
  const wrap=document.getElementById('tabs');
  wrap.innerHTML='';
  cats.forEach(cat=>{
    const btn=document.createElement('button');
    btn.className='tab'+(cat===curCat?' active':'');
    const hasProg=ALL_WORDS[cat].some(w=>store[w.en]&&store[w.en].seen>0);
    if(hasProg&&cat!==curCat)btn.classList.add('has-prog');
    btn.textContent=cat;
    btn.onclick=()=>{curCat=cat;buildTabs();restart();};
    wrap.appendChild(btn);
  });
}

// ── SHUFFLE ──
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}

// ── SWIPE ──
let touchX=0;
document.getElementById('card-scene').addEventListener('touchstart',e=>{touchX=e.touches[0].clientX;},{passive:true});
document.getElementById('card-scene').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-touchX;
  if(Math.abs(dx)>60&&flipped){
    if(dx>0)answer(true);
    else answer(false);
  }
},{passive:true});

// ── MODE ──
function setMode(m){
  mode=m;
  ['flash','quiz','type'].forEach(x=>{
    document.getElementById('m-'+x).classList.toggle('active',x===m);
    document.getElementById(x+'-ui').style.display=(x===m)?'':'none';
  });
  document.getElementById('result').classList.remove('show');
  restart();
}

// ── RESTART ──
function restart(){
  deck=shuffle([...ALL_WORDS[curCat]]);
  idx=0;knowC=0;wrongC=0;flipped=false;
  document.getElementById('result').classList.remove('show');
  ['flash-ui','quiz-ui','type-ui'].forEach(id=>{
    document.getElementById(id).style.display=(id===mode+'-ui')?'':'none';
  });
  showCard();
  document.getElementById('scroll-area').scrollTop=0;
}

// ── SHOW CARD ──
function showCard(){
  if(idx>=deck.length){showResult();return;}
  const c=deck[idx],total=deck.length;
  document.getElementById('prog-text').textContent=`Thẻ ${idx+1}/${total}`;
  document.getElementById('prog-score').textContent=`✅ ${knowC} ❌ ${wrongC}`;
  document.getElementById('prog-fill').style.width=(idx/total*100)+'%';
  if(mode==='flash'){
    document.getElementById('f-en').textContent=c.en;
    document.getElementById('f-ph').textContent=c.ph;
    document.getElementById('f-vi').textContent=c.vi;
    document.getElementById('f-type').textContent=c.type;
    document.getElementById('f-ex').textContent='"'+c.ex+'"';
    flipped=false;
    document.getElementById('card-scene').classList.remove('flipped');
  } else if(mode==='quiz'){
    showQuiz(c);
  } else {
    showType(c);
  }
}

// ── FLASH ──
function flipCard(){
  flipped=!flipped;
  document.getElementById('card-scene').classList.toggle('flipped',flipped);
}
function answer(know){
  recordAnswer(deck[idx].en,know);
  if(know)knowC++; else wrongC++;
  idx++;showCard();
}

// ── QUIZ ──
function showQuiz(c){
  document.getElementById('q-en').textContent=c.en;
  document.getElementById('q-ph').textContent=c.ph;
  const pool=ALL_WORDS[curCat].filter(w=>w.en!==c.en);
  const wrong=shuffle(pool).slice(0,3).map(w=>w.vi);
  const opts=shuffle([c.vi,...wrong]);
  const wrap=document.getElementById('q-opts');
  wrap.innerHTML='';
  opts.forEach(opt=>{
    const btn=document.createElement('button');
    btn.className='quiz-opt';
    btn.textContent=opt;
    btn.onclick=()=>selectQuiz(btn,opt,c);
    wrap.appendChild(btn);
  });
}
function selectQuiz(btn,selected,c){
  const correct=selected===c.vi;
  recordAnswer(c.en,correct);
  document.querySelectorAll('.quiz-opt').forEach(b=>{
    b.disabled=true;
    if(b.textContent===c.vi)b.classList.add('correct');
    else if(b===btn&&!correct)b.classList.add('wrong');
  });
  if(correct)knowC++; else wrongC++;
  setTimeout(()=>{idx++;showCard();},900);
}

// ── TYPE ──
function showType(c){
  document.getElementById('t-en').textContent=c.en;
  document.getElementById('t-ph').textContent=c.ph;
  document.getElementById('t-ex').textContent='"'+c.ex+'"';
  const inp=document.getElementById('t-input');
  inp.value='';inp.className='type-input';inp.disabled=false;
  document.getElementById('t-feedback').className='type-feedback';
  document.getElementById('t-feedback').textContent='';
  document.getElementById('t-next-row').style.display='none';
  typeAnswered=false;
}
function normalize(s){
  return s.toLowerCase().trim()
    .replace(/[àáạảãâầấậẩẫăằắặẳẵ]/g,'a')
    .replace(/[èéẹẻẽêềếệểễ]/g,'e')
    .replace(/[ìíịỉĩ]/g,'i')
    .replace(/[òóọỏõôồốộổỗơờớợởỡ]/g,'o')
    .replace(/[ùúụủũưừứựửữ]/g,'u')
    .replace(/[ỳýỵỷỹ]/g,'y')
    .replace(/đ/g,'d')
    .replace(/\s+/g,' ');
}
function checkType(){
  const c=deck[idx];
  const inp=document.getElementById('t-input');
  const val=inp.value.trim();
  if(!val||typeAnswered)return;
  typeAnswered=true;
  const nv=normalize(val);
  const answers=c.vi.split('/').map(s=>normalize(s.trim()));
  const correct=answers.some(a=>a===nv||a.includes(nv)||nv.includes(a.split(' ')[0]));
  inp.disabled=true;
  inp.className='type-input '+(correct?'correct-input':'wrong-input');
  const fb=document.getElementById('t-feedback');
  fb.className='type-feedback show '+(correct?'ok':'no');
  fb.textContent=correct?'✅ Đúng rồi! '+c.vi:'❌ Chưa đúng. Đáp án: '+c.vi;
  recordAnswer(c.en,correct);
  if(correct)knowC++; else wrongC++;
  document.getElementById('t-next-row').style.display='flex';
}
function nextCard(){idx++;showCard();}

// ── RESULT ──
function showResult(){
  ['flash-ui','quiz-ui','type-ui'].forEach(id=>document.getElementById(id).style.display='none');
  const res=document.getElementById('result');
  res.classList.add('show');
  document.getElementById('r-know').textContent=knowC;
  document.getElementById('r-wrong').textContent=wrongC;
  document.getElementById('r-total').textContent=deck.length;
  const pct=Math.round(knowC/deck.length*100);
  document.getElementById('r-msg').textContent=
    pct>=80?`Xuất sắc! Nhớ ${pct}% 🔥`:
    pct>=50?`Khá tốt! Ôn lại những từ còn sai 💪`:
    `Cố lên! Tiếp tục học nhé 📚`;
  buildTabs();
}

// ── PAGES ──
function showPage(p){
  ['learn','weak','progress'].forEach(x=>{
    document.getElementById('page-'+x).style.display=(x===p)?'':'none';
    document.getElementById('nav-'+x).classList.toggle('active',x===p);
  });
  document.getElementById('scroll-area').scrollTop=0;
  if(p==='weak')renderWeak();
  if(p==='progress')renderProgress();
}

// ── WEAK ──
function renderWeak(){
  const list=document.getElementById('weak-list');
  list.innerHTML='';
  let items=[];
  cats.forEach(cat=>{
    ALL_WORDS[cat].forEach(w=>{
      const d=store[w.en];
      if(d&&d.seen>=1&&d.wrong>=1){
        const pct=Math.round(d.wrong/d.seen*100);
        if(pct>=30)items.push({...w,pct,cat});
      }
    });
  });
  items.sort((a,b)=>b.pct-a.pct);
  if(!items.length){
    list.innerHTML='<div class="empty-state"><span class="big">🎉</span>Chưa có từ yếu nào!<br>Hãy học thêm để theo dõi.</div>';
    return;
  }
  items.forEach(w=>{
    const div=document.createElement('div');
    div.className='weak-item';
    div.innerHTML=`<span class="weak-en">${w.en}</span><span class="weak-vi">${w.vi}</span><span class="weak-score">sai ${w.pct}%</span>`;
    list.appendChild(div);
  });
}

// ── PROGRESS ──
function renderProgress(){
  let totalSeen=0,totalWords=0;
  cats.forEach(cat=>totalWords+=ALL_WORDS[cat].length);
  Object.values(store).forEach(d=>{if(d.seen>0)totalSeen++;});
  document.getElementById('prog-summary').textContent=
    `Đã học: ${totalSeen}/${totalWords} từ (${Math.round(totalSeen/totalWords*100)}%)`;
  const wrap=document.getElementById('cat-prog-list');
  wrap.innerHTML='';
  cats.forEach(cat=>{
    const words=ALL_WORDS[cat];
    const seen=words.filter(w=>store[w.en]&&store[w.en].seen>0).length;
    const pct=Math.round(seen/words.length*100);
    const div=document.createElement('div');
    div.className='cat-prog-item';
    div.innerHTML=`<div class="cat-prog-top"><span class="cat-prog-name">${cat}</span><span class="cat-prog-pct">${seen}/${words.length} · ${pct}%</span></div><div class="cat-prog-bar"><div class="cat-prog-fill" style="width:${pct}%"></div></div>`;
    wrap.appendChild(div);
  });
}

// ── THEME ──
function toggleTheme(){
  document.body.classList.toggle('light');
  document.getElementById('btn-theme').textContent=document.body.classList.contains('light')?'🌙':'☀️';
  localStorage.setItem('fc_theme2',document.body.classList.contains('light')?'light':'dark');
}

// ── INIT ──
(function(){
  if(localStorage.getItem('fc_theme2')==='light'){
    document.body.classList.add('light');
    document.getElementById('btn-theme').textContent='🌙';
  }
  buildTabs();
  restart();
})();
</script>
</body>
